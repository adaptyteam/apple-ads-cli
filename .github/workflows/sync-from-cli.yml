name: sync-from-cli
on:
  workflow_dispatch:
    inputs:
      ref: { description: 'adapty-cli ref or tag to sync from', required: true, default: 'main' }
  repository_dispatch:
    types: [adapty-cli-released]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/sync-agent-docs.mjs --ref=${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}
      - run: node scripts/lint-playbooks.mjs
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/agent-docs
          title: 'Sync agent docs from adapty-cli'
          body: |
            Generated by `scripts/sync-agent-docs.mjs`. Do not edit the synced files here —
            edit `docs/agent/` in adaptyteam/adapty-cli and re-run the sync.

            If `lint-playbooks.mjs` failed on this PR, a playbook references a command that
            no longer exists. Fix the playbook, not the reference.
          commit-message: 'chore: sync agent docs from adapty-cli'
